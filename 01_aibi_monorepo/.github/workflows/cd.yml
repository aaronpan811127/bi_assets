name: CD — deploy DAB bundles

# Mirrors the CD behaviour documented in README.md:
#   1. Detect changed DAB folders from the most recent merge commit delta.
#   2. Each changed domain bundle deploys:
#        dab_prehook -> bundle validate -> metric_view_deploy -> bundle deploy --auto-approve
#
# Shared metric views live in their own repo (02_dataplatform_repo) and are
# deployed by that repo's pipeline before domain bundles depend on them.

on:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: cd-${{ github.workflow }}
  cancel-in-progress: false # never interrupt an in-flight deploy

jobs:
  detect:
    name: Detect changed DAB folders
    runs-on: ubuntu-latest
    outputs:
      dabs: ${{ steps.detect.outputs.dabs }}
      any: ${{ steps.detect.outputs.any }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect changed bundles (merge commit delta)
        id: detect
        run: bash .github/scripts/detect-changed-dabs.sh HEAD~1

  deploy-domains:
    name: Deploy ${{ matrix.dab }}
    needs: detect
    if: needs.detect.outputs.dabs != '[]'
    runs-on: ubuntu-latest
    environment: presentation
    strategy:
      fail-fast: false
      matrix:
        dab: ${{ fromJSON(needs.detect.outputs.dabs) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-databricks
        with:
          host: ${{ vars.DATABRICKS_HOST }}
          token: ${{ secrets.DATABRICKS_TOKEN }}

      - name: dab_prehook (rule-based config validation)
        working-directory: ${{ matrix.dab }}
        run: dab_prehook

      - name: databricks bundle validate
        working-directory: ${{ matrix.dab }}
        run: databricks bundle validate

      - name: metric_view_deploy (domain specific metric views)
        working-directory: ${{ matrix.dab }}
        run: metric_view_deploy

      - name: databricks bundle deploy --auto-approve
        working-directory: ${{ matrix.dab }}
        run: databricks bundle deploy --auto-approve
